<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web PM REG 5 - Maintenance Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-100">
    <!-- Blurred Background Layers -->
    <div class="fixed inset-0 bg-cover bg-center filter blur-3xl scale-110 opacity-30 z-0" style="background-image: url('/sawit.jpg');"></div>
    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-2xl z-0"></div>

    <div class="relative z-10 max-w-md w-full glass-card border-2 border-red-500/80 rounded-3xl p-6 sm:p-8 shadow-2xl text-center flex flex-col items-center gap-5">
        <!-- Animated Maintenance Warning Icon -->
        <div class="w-16 h-16 bg-red-500/20 border-2 border-red-500/40 rounded-2xl flex items-center justify-center text-red-400 animate-pulse">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <div class="space-y-3 w-full">
            <span class="inline-block px-3 py-1 bg-amber-500/20 border border-amber-400/40 text-amber-300 text-[11px] font-extrabold rounded-full uppercase tracking-wider">
                ⚠️ PEMELIHARAAN SERVER / MAINTENANCE MODE
            </span>
            <h1 class="text-xl font-black text-white">
                Web PM REG 5 Sedang Maintenance
            </h1>
            
            <!-- Red Warning Box -->
            <div class="w-full bg-red-950/90 border-2 border-red-500 rounded-2xl p-4 text-red-100 text-xs sm:text-sm font-bold leading-relaxed shadow-lg text-center" style="background-color: rgba(69, 10, 10, 0.9); border: 2px solid #ef4444; border-radius: 1rem; padding: 1rem;">
                Web PM REG 5 anda sedang maintenance dan dialihkan ke Server DEV.
            </div>
        </div>

        <!-- Button to DEV Server -->
        <a href="https://devpmreg5.afratarigan.my.id/?action=login" class="w-full py-3.5 px-5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-sm rounded-2xl shadow-xl shadow-emerald-900/40 transition-all flex items-center justify-center gap-2 group">
            <span>Buka Web DEV (devpmreg5.afratarigan.my.id)</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        </a>

        <!-- Automatic Redirect Counter Badge -->
        <div class="flex items-center justify-center gap-2 text-xs font-bold text-amber-400 bg-amber-950/60 border border-amber-500/40 px-4 py-2 rounded-xl w-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 animate-spin text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>Mengalihkan otomatis ke server DEV dalam <strong id="countdown" class="text-white text-sm font-extrabold px-1">10</strong> detik...</span>
        </div>

        <!-- Password Input Form -->
        <div class="w-full pt-4 border-t border-slate-800 space-y-3 text-left">
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                🔑 Masukkan Password Untuk Akses Server
            </label>
            
            <div id="errorAlert" class="hidden bg-red-500/20 border border-red-500/40 text-red-300 text-xs p-2.5 rounded-xl font-bold flex items-center gap-2">
                <span>Password salah!</span>
            </div>

            <div class="flex gap-2">
                <input 
                    type="password" 
                    id="passInput"
                    placeholder="Password..."
                    class="flex-1 px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs sm:text-sm font-bold text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
                <button
                    onclick="checkPassword()"
                    class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-md transition-all whitespace-nowrap"
                >
                    Masuk
                </button>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            timeLeft--;
            if (countdownEl) countdownEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = "https://devpmreg5.afratarigan.my.id/?action=login";
            }
        }, 1000);

        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            if (pass === 'Akuhebat123#') {
                clearInterval(timer);
                document.cookie = "pmreg5_unlocked=true; path=/; max-age=86400";
                window.location.href = "/app_index.html?action=login";
            } else {
                document.getElementById('errorAlert').classList.remove('hidden');
            }
        }
        document.getElementById('passInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
