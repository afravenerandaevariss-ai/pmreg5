name: 🚀 Deploy PROD → Vercel

on:
  push:
    branches: [main]
    paths:
      - 'MP/MP/sap-input-app/src/**'
      - 'MP/MP/sap-input-app/public/**'
      - 'MP/MP/sap-input-app/package.json'
      - 'MP/MP/sap-input-app/vite.config.js'
      - 'MP/MP/sap-input-app/index.html'
      - 'MP/MP/sap-input-app/vercel.json'
      - 'MP/MP/sap-input-app/package-lock.json'
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Build & Verify PROD (Vercel auto-deploys)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: MP/MP/sap-input-app/package-lock.json

      - name: Install dependencies
        working-directory: MP/MP/sap-input-app
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci --prefer-offline

      - name: Build PROD (verify only - Vercel builds automatically on push)
        working-directory: MP/MP/sap-input-app
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: https://pabnvxlvrussdfhisxzn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_btvgcbyES8_4w5x3dE-atg_kYfUAii4
        run: npx vite build --mode production --outDir dist-prod

      - name: Done
        run: |
          echo "✅ PRODUCTION build verified!"
          echo "   Vercel auto-deploys main branch → https://pmreg5.vercel.app"
          echo "   Custom domain                   → https://pmreg5.afratarigan.my.id"
